# reviewed: true   Terms were read and allow this use. Runs everywhere.
# reviewed: false  Not yet decided. Runs only locally with BULLPENPHONE_INCLUDE_UNREVIEWED=1.
# excluded: true   Must not be fetched at all, including locally.
# kind: fansite    Labeled as a fan site, tied to one team, and never changes a player's status.
#
# SB Nation sites are part of Penske Media. Its terms allow headline feeds in aggregators when
# they're unedited, directly linked and attributed. Only headlines are read from these feeds.
feeds:
  - id: yahoo
    name: Yahoo Sports
    url: "https://sports.yahoo.com/mlb/rss/"
    reviewed: true
    notes: "RSS terms allow display that is unmodified, attributed and linked, with no ads. Yahoo may require us to stop at any time."
  - id: espn
    name: ESPN
    url: "https://www.espn.com/espn/rss/mlb/news"
    reviewed: true
    excluded: true
    notes: "Terms allow this display, but the feed failed from GitHub's servers and returns an empty 202 to some clients, likely bot protection. Off rather than worked around."
  - id: athletic
    name: The Athletic
    url: "https://www.nytimes.com/athletic/rss/mlb/"
    reviewed: true
    excluded: true
    notes: "NYT terms bar automated collection and caching without written consent."
  - id: mlbcom
    name: MLB.com
    url: "https://www.mlb.com/feeds/news/rss.xml"
    reviewed: true
    excluded: true
    notes: "Terms require written permission to display content."
  - id: nypost
    name: New York Post
    url: "https://nypost.com/mlb/feed/"
    reviewed: true
    excluded: true
    notes: "Terms limit use to personal and non-commercial, with no RSS allowance."
  - id: cbs
    name: CBS Sports
    url: "https://www.cbssports.com/rss/headlines/mlb/"
    reviewed: true
    excluded: true
    notes: "Terms bar scraping and indexing a significant portion of content."
