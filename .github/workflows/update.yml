name: Update
# Scheduled runs do nothing until the repo variable BULLPENPHONE_LIVE is "true". See docs/LAUNCH.md.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: update, cancel-in-progress: false }
jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.BULLPENPHONE_LIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Restore data
        run: |
          mkdir -p .data
          if git fetch --depth=1 origin data:refs/remotes/origin/data; then
            for file in state.json latest.json players.json players.meta.json; do
              git show "origin/data:$file" > ".data/$file" 2>/dev/null || rm -f ".data/$file"
            done
          fi
      - id: run
        run: npx tsx src/pipeline/run.ts
      - name: Guard output
        run: npx tsx scripts/check-output.ts .data
      - name: Commit data
        if: steps.run.outputs.changed == 'true'
        run: npx tsx scripts/commit-data.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
  publish:
    needs: ingest
    # A manual run always publishes, so site code changes can ship without new data.
    if: vars.BULLPENPHONE_LIVE == 'true' && (needs.ingest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Restore data
        run: |
          mkdir -p .data
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git show origin/data:state.json > .data/state.json
      - run: npx astro build
      - run: npx pagefind --site dist
      - run: npx tsx scripts/check-output.ts dist .data
      - name: Publish to gh-pages
        run: npx tsx scripts/publish-site.ts dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
