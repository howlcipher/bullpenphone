name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      build_gate:
        description: Run the synthetic 5,000-thread build gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx vitest run
      - run: npx astro check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  build-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.build_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/synth-data.ts 5000 .data-synth
      - name: Build 5,000 threads within 3 minutes
        run: |
          start=$(date +%s)
          DATA_DIR=.data-synth npx astro build --outDir dist-synth
          npx pagefind --site dist-synth
          took=$(( $(date +%s) - start ))
          echo "Build took ${took}s, $(du -sh dist-synth | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$took" -le 180
